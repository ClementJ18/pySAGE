name: Build release binaries

# Manual only: PyInstaller builds are slow and large. Each spec is built per OS - Windows for the
# .exe set modders run, Linux for mod repos' lint workflows.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: >-
          Only build specs whose repo-relative path contains one of these, space-separated
          (e.g. "sage_lint sage_ini"). Leave empty to build every spec in the repo.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One OS failing must not cancel the other's upload.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: .exe
          # A frozen binary needs at least the glibc it was built against; older is more portable.
          - os: ubuntu-latest
            platform: linux
            exe: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # System libraries PyQt6 links against; PyInstaller imports Qt while analysing the UI specs.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # PyInstaller imports each spec's dependencies, so every extra is needed.
      - name: Install the package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install "pyinstaller>=6"

      # An env var rather than `${{ }}`, so the input cannot inject shell; unquoted so filters split.
      - name: Build every spec
        shell: bash
        env:
          SPECS: ${{ inputs.specs }}
        run: python tools/build_release.py $SPECS

      # The frozen binary must run and write the current baseline format; skipped if not built.
      - name: Smoke-test the CLI binary
        shell: bash
        env:
          EXE: ${{ matrix.exe }}
        run: |
          cli="build/release-dist/sage_lint$EXE"
          if [ ! -f "$cli" ]; then
            echo "sage_lint$EXE not built (filtered out) - skipping smoke test"
            exit 0
          fi
          "$cli" --help > /dev/null
          mkdir -p smoke
          printf 'Object Foo\n    BuildCost = 1\n    BuildCost = 2\nEnd\n' > smoke/a.ini
          "$cli" lint smoke --no-config --write-baseline --baseline smoke/baseline.json
          python -c "import json;e=json.load(open('smoke/baseline.json'))['entries'];assert e and all('id' in x for x in e), e;print('baseline format OK:', len(e), 'entries')"

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: pySAGE-${{ matrix.platform }}-${{ github.run_number }}
          path: build/release-dist/
          if-no-files-found: error
          retention-days: 14
