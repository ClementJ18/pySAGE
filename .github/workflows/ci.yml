name: CI

# Jobs: lint + typing, the core suite on every OS/Python, the full suite with all extras, and a
# wheel smoke test.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff==0.15.22 mypy==2.3.0  # pinned ruff matches .pre-commit-config.yaml
          # pytest's own type hints, for mypy's check of the `sage_test.plugin` pytest plugin.
          pip install pytest

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy typing coverage
        run: mypy

  # numpy is the one extra installed here, so the geometry suites run across the matrix too.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (numpy only, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "numpy>=2"  # numpy>=2 matches the [worldbuilder] and [w3d-view] extras

      - name: Core test suite
        run: pytest -q

  # Everything, with all extras; the corpus gates skip because CI has no game data.
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # System libraries PyQt6 links against; the suites run Qt offscreen, so no display needed.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest

      # bash's pipefail lets a pytest failure through the `tee` below.
      - name: Full test suite
        shell: bash
        run: |
          pytest -q --full -rs | tee pytest-full.log
          # Every extra is installed, so a skip naming one means a dependency is missing here.
          if grep -E "^SKIPPED.*extra" pytest-full.log; then
            echo "::error::A test skipped for a missing optional dependency (see above); add it to the extras installed in this job."
            exit 1
          fi

  # Package data and console scripts must work from an installed wheel, not just the checkout.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Check the metadata renders on PyPI
        run: twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl

      # Core CLIs run with no extras; desktop apps refuse with the pip command to fix it.
      - name: Console scripts work without extras
        run: |
          for script in sage-lint sage-ini sage-live sage-replay sage-apt sage-save sage-map sage-asset sage-w3d sage-cah sage-patch sage-test sage-verify; do
            echo "== $script"
            /tmp/wheelenv/bin/$script --help > /dev/null
          done

      - name: Desktop scripts explain the missing extra
        run: |
          for script in sage-ui sage-wiki sage-lint-ui sage-asset-ui sage-cah-ui sage-worldbuilder; do
            echo "== $script"
            if /tmp/wheelenv/bin/$script > /tmp/out.txt 2>&1; then
              echo "expected a non-zero exit without the extra installed"; exit 1
            fi
            grep -q "pip install" /tmp/out.txt || { echo "no install hint:"; cat /tmp/out.txt; exit 1; }
          done
