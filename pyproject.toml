[build-system]
requires = ["setuptools>=77"]  # >=77 for the PEP 639 SPDX `license` field below
build-backend = "setuptools.build_meta"

[project]
name = "pysage-tools"
version = "0.4.0"
description = "Python tools for the data formats of the SAGE engine (Battle for Middle-earth): ini game data, binary maps, replays, and UI movies."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Clement Julia", email = "clement.julia13@gmail.com" },
]
keywords = ["sage", "bfme", "ini", "parser", "linter", "map", "replay", "modding"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Games/Entertainment",
]
dependencies = [
    # Fast RefPack compressor for map saving; Windows-only DLL, elsewhere the pure-Python one runs.
    "reversebox>=0.84; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ClementJ18/pySAGE"
Repository = "https://github.com/ClementJ18/pySAGE"
Issues = "https://github.com/ClementJ18/pySAGE/issues"

[project.scripts]
sage-lint = "sage_lint.__main__:main"
sage-ini = "sage_ini.__main__:main"
sage-live = "sage_live.__main__:main"
sage-replay = "sage_replay.__main__:main"
sage-apt = "sage_apt.__main__:main"
sage-save = "sage_save.__main__:main"
sage-map = "sage_map.__main__:main"
sage-asset = "sage_asset.__main__:main"
sage-w3d = "sage_w3d.__main__:main"
sage-cah = "sage_cah.__main__:main"
sage-patch = "sage_patch.__main__:main"
sage-test = "sage_test.__main__:main"
sage-verify = "sage_verify.__main__:main"

# Desktop apps; each needs its extra installed (ui / wiki / lint-ui / asset-ui / cah-ui).
[project.gui-scripts]
sage-ui = "sage_ui.app:main"
sage-wiki = "sage_wiki.app:main"
sage-lint-ui = "sage_lint.ui.app:main"
sage-asset-ui = "sage_asset.ui.app:main"
sage-cah-ui = "sage_cah.ui.app:main"
sage-worldbuilder = "sage_worldbuilder.ui.app:main"

[project.optional-dependencies]
ui = [
    "PyQt6>=6.6",
    "pybig>=0.6",
    "pillow>=10",
]

lint-ui = [
    "PyQt6>=6.6",
]

wiki = [
    "mwclient>=0.11", 
    "mwparserfromhell>=0.7", 
    "PyQt6>=6.6", 
    "pybig>=0.6",
    "keyring>=24",
]

asset-ui = [
    "PyQt6>=6.6",
]

# The Create-a-Hero editor; pyBIG because the game's hero data ships inside `ini.big`.
cah-ui = [
    "PyQt6>=6.6",
    "pybig>=0.6",
]

apt = [
    "pybig>=0.6",  # reading a .const (or .apt) out of a .big archive; the core stays stdlib-only
]

w3d-view = [
    "PyQt6>=6.6",
    "PyOpenGL>=3.1",
    "numpy>=2",
    "pillow>=10",
]

# Reverse-engineering tools for game.dat. Applying and verifying patches needs none of this.
patch = [
    "capstone>=5",
    "pefile>=2023",
    # Runs caves in tests (tests/sage_patch/wotr_world.py); those tests skip without it.
    "unicorn>=2.0",
]

# The map editor; pyBIG because a game's maps and ini data live in its `.big` archives.
worldbuilder = [
    "PyQt6>=6.6",
    # Qt 6.11.0 and 6.11.1 crash when an undocked panel is closed.
    "PyQt6-Qt6!=6.11.0,!=6.11.1",
    "pybig>=0.6",
    "numpy>=2",
    "PyOpenGL>=3.1",  # the 3D view
    "pillow>=10",  # terrain texture decoding
]

# Every extra above, by self-reference; tests/test_packaging.py checks none is missing.
all = [
    "pysage-tools[ui]",
    "pysage-tools[lint-ui]",
    "pysage-tools[wiki]",
    "pysage-tools[asset-ui]",
    "pysage-tools[cah-ui]",
    "pysage-tools[apt]",
    "pysage-tools[w3d-view]",
    "pysage-tools[patch]",
    "pysage-tools[worldbuilder]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pyinstaller>=6",  # builds the desktop .exe bundles (the *.spec files); not a runtime dep
]

[tool.setuptools.packages.find]
include = ["sage_apt*", "sage_asset*", "sage_ini*", "sage_lint*", "sage_map*", "sage_patch*", "sage_live*", "sage_replay*", "sage_test*", "sage_save*", "sage_utils*", "sage_wiki*", "sage_ui*", "sage_w3d*", "sage_cah*", "sage_verify*", "sage_worldbuilder*"]

[tool.setuptools.package-data]
# Every file a package opens at runtime; tests/test_packaging.py checks they all ship.
sage_apt = ["assets/*.html", "py.typed"]
sage_asset = ["py.typed", "ui/*.ico"]
sage_w3d = ["py.typed"]
sage_cah = ["py.typed", "ui/*.ico"]
sage_verify = ["py.typed"]
sage_ini = ["py.typed", "skill_assets/**/*"]
sage_map = ["py.typed"]
sage_patch = ["py.typed", "scripts/wiki_assets/*"]
sage_save = ["py.typed"]
sage_replay = ["py.typed", "assets/*"]
sage_live = ["py.typed"]
sage_test = ["py.typed"]
sage_worldbuilder = [
    "py.typed",
    "keymap.json",
    "script_templates.json",
    # WorldBuilder's own icons, cursors and toolbar buttons (tools/extract_worldbuilder_icons.py).
    "assets/worldbuilder_icons/*.txt",
    "assets/worldbuilder_icons/*/*.png",
    "assets/worldbuilder_icons/*/*.ico",
    "assets/worldbuilder_icons/*/*.cur",
]
sage_ui = ["*.ico"]
sage_wiki = ["*.ico"]
sage_utils = ["assets/*.png", "assets/*.svg"]  # portrait background + overlays (textures.py), check mark (styles.py)
"sage_lint.ui" = ["*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "full: part of the full suite (corpus gates + peripheral packages); run with --full",
]

[tool.ruff]
target-version = "py312"  # matches requires-python, so pyupgrade cannot suggest 3.13-only syntax
line-length = 100
extend-exclude = [
    "data", # game-data corpus
    # One-off RE scans, run from inside their own directory; kept for provenance, not maintained.
    "sage_patch/scripts",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors (E722: no bare `except:`)
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort - deterministic import order
    "B",       # bugbear (B009/B010: no getattr/setattr with constant attribute names)
    "UP",      # pyupgrade
    "BLE",     # blind-except: no `except Exception:` swallowing
    "PLC0415", # all imports at module top level; no function-local imports
]

[tool.ruff.lint.per-file-ignores]
"sage_ini/model/behaviors.py" = ["F821"]
"sage_ini/model/nuggets.py" = ["F821"]
"sage_ini/model/data_blocks.py" = ["F821"]
# The embedded single-page HTML/CSS/JS template carries lines longer than the Python limit.
"sage_apt/viewer.py" = ["E501"]
"sage_replay/aggregate.py" = ["E501"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.12"  # matches requires-python: catch 3.13-only API use on the lowest floor
files = ["sage_apt", "sage_asset", "sage_ini", "sage_lint", "sage_live", "sage_map", "sage_patch", "sage_replay", "sage_save", "sage_test", "sage_utils", "sage_w3d", "sage_cah", "sage_verify", "sage_worldbuilder", "sage_ui", "sage_wiki", "examples/sage_live"]
# `examples/sage_live` drives a live game the test suite cannot reach, so mypy is its only check.
disable_error_code = ["annotation-unchecked"]
# The one-off RE scans ruff skips above.
exclude = ["sage_patch/scripts/"]

[[tool.mypy.overrides]]
# Untyped optional dependencies; `sublime*` exist only inside Sublime Text itself.
module = ["reversebox.*", "PyQt6.*", "pyBIG.*", "PIL.*", "OpenGL.*", "numpy.*", "capstone.*", "pefile", "unicorn.*", "sublime", "sublime_plugin", "mwclient.*", "mwparserfromhell.*", "keyring.*"]
ignore_missing_imports = true

# Qt code that predates annotations is not type-checked yet; the Qt-free code beside it is.
[[tool.mypy.overrides]]
module = [
    "sage_utils.widgets",
    "sage_utils.styles",
    "sage_utils.textures",
    "sage_utils.sources",
    "sage_utils.findings",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sage_lint.ui.window", "sage_lint.ui.app"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sage_cah.ui.window", "sage_cah.ui.app"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sage_worldbuilder.ui.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sage_ui.browser", "sage_ui.extract", "sage_ui.object_browser", "sage_ui.unit_panel", "sage_wiki.window", "sage_wiki.cards.*"]
ignore_errors = true
